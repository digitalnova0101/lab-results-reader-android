name: app
description: Lab Results Reader — upload a lab report and get it explained in plain English.
publish_to: none
version: 2.1.0+21

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: any
  image_picker: any
  file_picker: ">=13.0.0 <14.0.0"
  shared_preferences: any
  google_fonts: ">=6.2.1 <7.0.0"

dev_dependencies:
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0B6E5C"
  adaptive_icon_foreground: "assets/icon_fg.png"
  min_sdk_android: 21
