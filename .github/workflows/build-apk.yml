# Har push pe GitHub free me Flutter APK banata hai aur "Releases" me daal deta hai.
# Seedha download link:
#   https://github.com/digitalnova0101/lab-results-reader-android/releases/latest/download/LabResultsReader.apk
name: Build Lab Results Reader APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: |
          flutter --version
          flutter create --no-pub --platforms=android --org com.labresultsreader --project-name app .
          rm -rf test
          python3 ci/patch_android.py

      - name: Get packages
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee pub.log

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Fixed signing key (so updates install over the old app)
        run: mkdir -p ~/.android && cp keys/debug.keystore ~/.android/debug.keystore

      - name: Check code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
          cp build/app/outputs/flutter-apk/app-release.apk LabResultsReader.apk
          flutter build apk --release --split-per-abi 2>&1 | tee -a build.log
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk LabResultsReader-arm64.apk
          flutter build appbundle --release 2>&1 | tee -a build.log
          cp build/app/outputs/bundle/release/app-release.aab LabResultsReader-unsigned.aab
          flutter build appbundle --release --target-platform android-arm64 2>&1 | tee -a build.log
          cp build/app/outputs/bundle/release/app-release.aab LabResultsReader-arm64-unsigned.aab
          ls -la *.apk *.aab
          # The APK must be signed with the fixed key (Google Sign-in + updates depend on it).
          SIGNER=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner
          $SIGNER verify --print-certs LabResultsReader-arm64.apk | tee -a build.log
          $SIGNER verify --print-certs LabResultsReader-arm64.apk | grep -qi "066ecf223f146978c8dad997e39b78f21942d10b" || { echo "WRONG SIGNING KEY" | tee -a build.log; exit 1; }

      - name: Publish APK (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-${{ github.run_number }}
          name: Lab Results Reader (Flutter build ${{ github.run_number }})
          files: |
            LabResultsReader.apk
            LabResultsReader-arm64.apk
            LabResultsReader-unsigned.aab
            LabResultsReader-arm64-unsigned.aab
          make_latest: true

      - name: Save error logs
        if: failure()
        run: |
          for f in pub.log analyze.log build.log; do [ -s $f ] || echo "(empty)" > $f; done

      - name: Upload error logs
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-log-${{ github.run_number }}
          name: Build log ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: |
            pub.log
            analyze.log
            build.log
