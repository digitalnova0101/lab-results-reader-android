# Har baar code upload/push karne par GitHub free me APK bana deta hai,
# aur use "Releases" me daal deta hai, jahan se phone pe seedha download hota hai.
#
# Seedha download link (apna username aur repo naam daalo):
#   https://github.com/USERNAME/REPO/releases/latest/download/LabResultsReader.apk
name: Build Lab Results Reader APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LabResultsReader.apk

      - name: Publish APK (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Lab Results Reader APK (build ${{ github.run_number }})
          files: LabResultsReader.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: LabResultsReader-APK
          path: LabResultsReader.apk
