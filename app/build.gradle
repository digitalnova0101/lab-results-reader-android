plugins {
    id 'com.android.application'
}

android {
    namespace 'com.labresultsreader.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.labresultsreader.app"   // Play Store par yahi app ki ID hogi
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "1.2"
    }

    // Fixed test key, so every new APK installs over the old one (no uninstall needed)
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
